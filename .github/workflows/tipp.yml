name: Kicktipp Auto-Tipp

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (UTC); getippt wird nur im Fenster vor Anpfiff
  workflow_dispatch: {}        # manueller Start-Knopf

jobs:
  tippen:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      KICKTIPP_EMAIL: ${{ secrets.KICKTIPP_EMAIL }}
      KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
      KICKTIPP_COMMUNITY: ${{ secrets.KICKTIPP_COMMUNITY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python kicktipp_tipper.py run --lead 3h --community wm26mv
      - run: python kicktipp_tipper.py run --lead 3h --community wm-2026-klinsmannserben
